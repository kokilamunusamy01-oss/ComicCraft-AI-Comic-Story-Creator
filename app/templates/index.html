<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="container">

    <section class="hero">

        <p class="eyebrow">
            AI COMIC STORY CREATOR
        </p>

        <h1>
            ComicCraft ✨
        </h1>

        <p>
            Turn your imagination into
            an AI-generated comic.
        </p>

    </section>


    {% if error %}

    <div class="error">

        <strong>
            Generation failed:
        </strong>

        {{ error }}

    </div>

    {% endif %}


    <form
        class="card form-card"
        action="/generate"
        method="post"
    >

        <label>

            Story Prompt

            <textarea
                name="story_prompt"
                required
                placeholder="A brave fox exploring an enchanted forest"
            ></textarea>

        </label>


        <div class="grid">


            <label>

                Main Character Name

                <input
                    type="text"
                    name="character_name"
                    required
                    placeholder="Luna"
                >

            </label>


            <label>

                Setting

                <select name="setting">

                    <option>
                        Enchanted forest
                    </option>

                    <option>
                        School
                    </option>

                    <option>
                        Space
                    </option>

                    <option>
                        Future city
                    </option>

                </select>

            </label>


            <label>

                Story Tone

                <select name="tone">

                    <option>
                        Funny
                    </option>

                    <option>
                        Light-hearted
                    </option>

                    <option>
                        Dramatic
                    </option>

                    <option>
                        Poetic
                    </option>

                </select>

            </label>


            <label>

                Art Style

                <select name="art_style">

                    <option>
                        Comic book
                    </option>

                    <option>
                        Anime
                    </option>

                    <option>
                        Pixel art
                    </option>

                    <option>
                        Realistic
                    </option>

                </select>

            </label>


            <label>

                Number of Panels

                <select name="panels">

                    <option value="5">
                        5
                    </option>

                    <option value="6">
                        6
                    </option>

                    <option value="7">
                        7
                    </option>

                    <option value="8">
                        8
                    </option>

                </select>

            </label>


        </div>


        <button type="submit">

            Create My Comic 🚀

        </button>


    </form>


    <p class="hint">

        Enter your story idea and
        preferences, then click
        Create My Comic.

    </p>


</main>


<script src="/static/js/app.js"></script>

</body>

</html>
